# Conda environment for the de-Ferra2020-kz REMARK.
#
# Create:   conda env create -f binder/environment.yml
# Activate: conda activate deferra2020-kz
# Update:   conda env update -f binder/environment.yml --prune
#
# This file is the single source of truth for the Python environment used by:
#   - the dev-container / Binder image
#   - reproduce.sh when compiling the paper or running the Jupyter notebook
# pyproject.toml mirrors the same pins for uv/pip users.

name: deferra2020-kz
channels:
  - conda-forge
  - defaults

dependencies:
  # Python: standardised on 3.12 across environment.yml, requirements.txt,
  # pyproject.toml, and Dockerfile.
  - python=3.12

  # Core scientific stack
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - matplotlib>=3.8
  - numba>=0.59

  # Jupyter (needed to view deFerra2020_bellman-stages.ipynb)
  - jupyter>=1.0
  - notebook>=7.0
  - ipykernel>=6.0
  - ipywidgets>=8.0

  # Statistical analysis and visualisation
  - statsmodels>=0.14
  - seaborn>=0.13

  # Development tools
  - black>=24.0
  - pytest>=7.0
  - ruff>=0.4.0

  # pip for packages not on conda
  - pip
  - pip:
      - econ-ark>=0.15
