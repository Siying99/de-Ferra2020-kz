# de-Ferra2020-kz is a REMARK (research artefact), not an installable package.
# This pyproject.toml manages Python dependencies only.

[project]
name = "deferra2020-kz"
version = "1.0.0"
description = "REMARK reproducing de Ferra, Mitman, and Romei (2020), 'Household heterogeneity and the transmission of foreign shocks'."
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Siying Li"},
]
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = [
    "economics",
    "computational",
    "heterogeneous-agents",
    "small-open-economy",
    "sudden-stops",
    "foreign-currency-debt",
    "HANK",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Economics",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    # Economics packages
    "econ-ark>=0.15",

    # Core scientific computing stack
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "numba>=0.59",
]

[dependency-groups]
jupyter = [
    "jupyter>=1.0",
    "notebook>=7.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]

analysis = [
    "statsmodels>=0.14",
    "seaborn>=0.13",
]

dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.4.0",
    "mypy>=1.8",
]

all = [
    {include-group = "jupyter"},
    {include-group = "analysis"},
    {include-group = "dev"},
]

# ============================================================================
# SYSTEM DEPENDENCIES (NOT MANAGED BY UV/PIP)
# ============================================================================
# Required to compile the paper's PDF:
#   - TeX Live 2023+ (pdflatex, bibtex, latexmk)
#
# Optional:
#   - Docker, for the dev-container workflow
# ============================================================================

[tool.setuptools]
# This project is not an installable package.
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
exclude = ["*"]

[tool.uv]
# uv manages the Python version from requires-python above.

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "venv", "build", "dist"]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["Code", "reproduce"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
