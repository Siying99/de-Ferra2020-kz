# Conda environment for the de-Ferra2020-kz REMARK (root convenience copy).
#
# Create:   conda env create -f environment.yml
# Activate: conda activate deferra2020-kz
# Update:   conda env update -f environment.yml --prune
#
# SINGLE SOURCE OF TRUTH: binder/environment.yml. This root-level file mirrors
# it verbatim so that `conda env create -f environment.yml` from the repo root
# yields the same Python 3.12 environment used by the dev-container, Binder,
# reproduce.sh, and the 14-notebook pipeline under Code/Python/. pyproject.toml
# mirrors the same pins for uv/pip users.
#
# (This replaces an earlier HAFiscal-template leftover that pinned Python 3.9
#  under the name `hafiscal`; that env would not run the 3.12 notebooks.)

name: deferra2020-kz
channels:
  - conda-forge
  - defaults

dependencies:
  # Python: standardised on 3.12 across environment.yml, binder/requirements.txt,
  # pyproject.toml, and Dockerfile.
  - python=3.12

  # Core scientific stack
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.1
  - matplotlib>=3.8
  - numba>=0.59

  # Jupyter (needed to run the Code/Python notebooks and view the stages notebook)
  - jupyter>=1.0
  - notebook>=7.0
  - ipykernel>=6.0
  - ipywidgets>=8.0

  # Statistical analysis and visualisation
  - statsmodels>=0.14
  - seaborn>=0.13

  # Development tools
  - black>=24.0
  - pytest>=7.0
  - ruff>=0.4.0

  # pip for packages not on conda
  - pip
  - pip:
      - econ-ark>=0.15
